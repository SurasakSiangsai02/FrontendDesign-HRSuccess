<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATTG HRSuccess [HRS]</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Tahoma, "Noto Sans Thai", system-ui, sans-serif; }
  .login { display: flex; min-height: 100vh; }

  /* ---------- left ---------- */
  .left { flex: 0 0 60%; position: relative; overflow: hidden; color: #fff;
    background: linear-gradient(135deg, #060B18 0%, #0B1A3D 50%, #132A6B 100%);
    padding: 72px 64px 64px; }
  .left::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 22px 22px; }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
  .glow.cyan { width: 420px; height: 420px; left: -140px; top: -140px; background: rgba(34,211,238,.18); }
  .glow.purple { width: 380px; height: 380px; right: -120px; top: 38%; background: rgba(139,92,246,.16); }
  .edge { position: absolute; right: 0; top: 8%; bottom: 8%; width: 1px; pointer-events: none;
    background: linear-gradient(transparent, rgba(34,211,238,.8), transparent); box-shadow: 0 0 8px rgba(34,211,238,.6); }
  .globe { position: absolute; left: 0; right: 0; bottom: 0; height: 42%; pointer-events: none; }
  .globe img { width: 100%; height: 100%; object-fit: cover; object-position: center bottom; filter: brightness(.8);
    -webkit-mask-image: linear-gradient(to top, #000 55%, transparent); mask-image: linear-gradient(to top, #000 55%, transparent); }
  .globe::after { content: ""; position: absolute; inset: 50% 0 0; background: linear-gradient(to top, rgba(6,11,24,.9), transparent); }
  .content { position: relative; z-index: 1; max-width: 576px; }

  .brand { display: flex; align-items: center; gap: 16px; }
  .app-logo { width: 64px; height: 64px; border-radius: 16px; flex: none; display: grid; place-items: center;
    background: linear-gradient(135deg, #0078D4, #00B7C3); box-shadow: 0 8px 24px rgba(0,120,212,.35); }
  .brand-text { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .abbr { font-size: 24px; font-weight: 700; line-height: 1; }
  .fullname { font-weight: 300; color: rgba(255,255,255,.7); font-size: 14px; }
  .pill-group { font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 999px; color: #fff;
    background: linear-gradient(90deg, #0078D4, #1e3a8a); }

  .rule { height: 1px; margin: 32px 0 24px; background: linear-gradient(90deg, rgba(255,255,255,.45), transparent); }
  h1 { font-size: 36px; font-weight: 800; line-height: 1.3; margin: 0; }
  h1 .accent { color: #22d3ee; white-space: nowrap; }
  .tagline { color: rgba(186,230,253,.8); margin: 10px 0 0; font-size: 15px; }

  .docs { display: flex; justify-content: center; gap: 12px; margin: 28px 0; flex-wrap: wrap; }
  .docs a { display: inline-flex; align-items: center; gap: 8px; background: #fff; color: #0d1a4a; text-decoration: none;
    font-size: 14px; font-weight: 600; padding: 8px 18px; border-radius: 999px; transition: transform .15s; }
  .docs a:hover { transform: translateY(-1px); }

  .obj-title { display: flex; align-items: center; gap: 10px; font-weight: 700; color: rgba(255,255,255,.75); margin: 0 0 14px; font-size: 15px; }
  .obj-title::before { content: ""; width: 20px; height: 3px; border-radius: 2px; background: #22d3ee; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(4px); }
  .card i { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; }
  .card span { font-weight: 600; font-size: 14px; line-height: 1.35; }

  /* ---------- right ---------- */
  .right { flex: 1; position: relative; overflow: hidden; background: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 80px 24px 200px; }
  .wave { position: absolute; left: 0; top: 0; width: 70%; opacity: .45; pointer-events: none; }
  .skyline { position: absolute; left: 0; bottom: 0; width: 100%; height: 160px; object-fit: cover; object-position: bottom; pointer-events: none; }
  .panel { position: relative; z-index: 1; width: 100%; max-width: 384px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .logo-card { position: relative; padding: 22px 30px; border-radius: 32px; background: #fff; margin-bottom: 28px;
    box-shadow: 10px 10px 24px rgba(13,26,74,.10), -10px -10px 24px rgba(255,255,255,.9); }
  .logo-card::before { content: ""; position: absolute; inset: -8px; z-index: -1; border-radius: 40px; filter: blur(18px); opacity: .55;
    background: linear-gradient(120deg, #22d3ee, #34d399, #f472b6); }
  .logo-card img { display: block; height: 44px; }
  h2 { font-size: 24px; font-weight: 700; color: #0d1a4a; margin: 0; text-shadow: 0 1px 0 #fff, 0 2px 3px rgba(13,26,74,.18); }
  .sub { color: #0078D4; font-size: 14px; margin: 6px 0 24px; }
  .ms-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; border: 0; cursor: pointer;
    padding: 14px 20px; border-radius: 999px; color: #fff; font: inherit; font-weight: 600; font-size: 15px;
    background: linear-gradient(90deg, #4f46e5, #1d4ed8); box-shadow: 0 10px 24px rgba(79,70,229,.30); transition: transform .15s, box-shadow .15s; }
  .ms-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(79,70,229,.38); }
  .ms-btn:disabled { opacity: .7; cursor: wait; transform: none; }
  .ms-logo { background: #fff; padding: 4px; border-radius: 4px; display: grid; }
  .demo-link { margin-top: 12px; font-size: 13px; color: #0078D4; background: none; border: 0; cursor: pointer; text-decoration: underline; font: inherit; font-size: 13px; }
  .error { margin-top: 14px; color: #b91c1c; font-size: 14px; }
  .divider { width: 100%; height: 1px; background: #e5e7eb; margin: 24px 0 14px; }
  .notice { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #475569; text-align: left; }
  .foot { position: absolute; z-index: 1; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 12px; color: #6b7280; }

  /* ---------- top-right controls ---------- */
  .tools { position: fixed; top: 16px; right: 16px; z-index: 10; display: flex; gap: 8px; }
  .seg, .icon-btn { background: rgba(255,255,255,.92); border: 1px solid #e5e7eb; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .seg { display: flex; padding: 3px; }
  .seg button { border: 0; background: none; font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; cursor: pointer; color: #334155; }
  .seg button[aria-pressed="true"] { background: #0078D4; color: #fff; }
  .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; color: #334155; }

  /* ---------- dialog ---------- */
  dialog { border: 0; border-radius: 16px; padding: 24px; width: min(480px, 92vw); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(6,11,24,.55); }
  .warn { background: #fff7ed; border: 1px solid #fdba74; border-radius: 12px; padding: 14px 16px; color: #7c2d12; font-size: 14px; }
  .warn b { display: block; margin-bottom: 6px; }
  .warn ol { margin: 0 0 8px; padding-left: 20px; } .warn li { margin: 4px 0; }
  .warn code { background: #ffedd5; padding: 0 4px; border-radius: 4px; word-break: break-all; }
  .warn a { color: #c2410c; }
  .demo-title { font-weight: 700; margin: 18px 0 8px; color: #0d1a4a; }
  .users { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow: auto; }
  .user { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 1px solid #e5e7eb; background: #fff;
    border-radius: 12px; padding: 8px 12px; cursor: pointer; font: inherit; }
  .user:hover { border-color: #00B7C3; background: #f0fdff; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700;
    background: linear-gradient(135deg, #0078D4, #00B7C3); }
  .who { flex: 1; min-width: 0; } .who div { font-weight: 600; color: #0f172a; }
  .who small { color: #64748b; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #e0f2fe; color: #0369a1; white-space: nowrap; }
  .badge.superadmin { background: #fee2e2; color: #b91c1c; } .badge.admin { background: #ede9fe; color: #6d28d9; }
  .badge.manager { background: #dcfce7; color: #15803d; }
  .close { margin-top: 16px; float: right; border: 1px solid #cbd5e1; background: #fff; border-radius: 999px; padding: 6px 16px; cursor: pointer; font: inherit; }

  /* ---------- dark ---------- */
  body.dark .right { background: linear-gradient(180deg, #0B1A3D, #060B18); }
  body.dark .wave, body.dark .skyline { display: none; }
  body.dark h2 { color: #22d3ee; text-shadow: none; }
  body.dark .sub { color: #7dd3fc; }
  body.dark .notice, body.dark .foot { color: #94a3b8; }
  body.dark .divider { background: rgba(255,255,255,.15); }
  body.dark .logo-card { box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  body.dark .seg, body.dark .icon-btn { background: rgba(15,23,42,.9); border-color: #334155; color: #e2e8f0; }
  body.dark .seg button { color: #e2e8f0; }
  body.dark .seg button[aria-pressed="true"] { color: #fff; }

  /* ---------- responsive ---------- */
  @media (min-width: 1440px) { .left { padding-left: 160px; } }
  @media (max-width: 1023px) { .login { flex-direction: column; } .left { flex: none; } .right { min-height: 640px; } }
  @media (max-width: 640px) { .left { padding: 72px 16px 48px; } .cards { grid-template-columns: 1fr; } h1 { font-size: 30px; } }
</style>
</head>
<body>

    <button type="button" data-lang="th">ไทย</button><button type="button" data-lang="en">English</button>

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0078D4" stroke-width="2" style="flex:none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>

</main>

<dialog id="dlg">
  <div class="warn" id="warn" hidden>
    <b data-i18n="warnTitle"></b>
    <ol><li id="step1"></li><li data-i18n="step2"></li><li data-i18n="step3"></li></ol>

    <div class="demo-title" data-i18n="demoTitle"></div>
    <div class="users" id="users"></div>
  </div>
  <button type="button" class="close" onclick="dlg.close()" data-i18n="close"></button>
</dialog>

<script>
const T = {
  th: {
    titleMain: 'ระบบติดตามการลา โอที และ', titleAccent: 'กำลังพล',
    tagline: 'ดูวันลาและโอทีสะสมของตัวเอง หัวหน้าดูแลการลาและโอทีของทีมได้ในที่เดียว',
    guide: 'คู่มือการใช้งาน', terms: 'เงื่อนไขการใช้งาน', objectives: 'วัตถุประสงค์',
    cards: ['ตรวจสอบวันลาสะสมและวันลาคงเหลือของตัวเอง', 'ดูชั่วโมงโอทีที่ขอสะสมได้ตลอดเวลา', 'หัวหน้าเห็นการลาและโอทีของลูกน้องทุกระดับ',
            'ควบคุมการขอโอทีของหน่วยงานได้ง่าย', 'กราฟกำลังพลรายแผนก รายเดือน และรายปี', 'สิทธิ์ตามบทบาท HR เห็นเฉพาะบริษัทตัวเอง'],
    signIn: 'เข้าสู่ระบบ', sub: 'ใช้บัญชี Microsoft 365 ของบริษัท', msBtn: 'ลงชื่อเข้าใช้ด้วย Microsoft 365',
    demoLink: 'ใช้ผู้ใช้ตัวอย่าง (เครื่องฝึก)', notice: 'พนักงาน AISIN GROUP (ATTG) ที่มีบัญชี Microsoft 365 เท่านั้น',
    warnTitle: '⚠ ยังไม่ได้ต่อ Microsoft 365',
    step1: 'ให้ IT ลงทะเบียนแอปใน Microsoft Entra ID หรือเพิ่มที่อยู่นี้ในทะเบียนที่ใช้ร่วมกับ DSR / A-SOP แล้วตั้ง Redirect URI (แบบ Single-page application) เป็น ',
    step2: 'ใส่ค่า M365_TENANT_ID และ M365_CLIENT_ID ในไฟล์ .env', step3: 'ปิดหน้าต่าง API แล้วเปิด start.bat ใหม่',
    contact: 'ติดต่อ Mr.Santi (santi.s@attg.co.th)', demoTitle: 'ผู้ใช้ตัวอย่าง (เครื่องฝึก)', close: 'ปิด',
    signingIn: 'กำลังเข้าสู่ระบบ…', dark: 'โหมดมืด', light: 'โหมดสว่าง',
  },
  en: {
    titleMain: 'Leave, OT & ', titleAccent: 'Workforce',
    tagline: 'Check your own leave and OT balance; managers oversee their team in one place',
    guide: 'User Guide', terms: 'Terms of Use', objectives: 'Objectives',
    cards: ['Check your leave taken and leave balance', 'See your accumulated OT hours anytime', 'Managers see leave and OT of every report below them',
            'Keep team OT requests under control', 'Headcount charts by department, month and year', 'Role-based access: HR sees only its own company'],
    signIn: 'Sign in', sub: 'Use your company Microsoft 365 account', msBtn: 'Sign in with Microsoft 365',
    demoLink: 'Use a sample user (training machine)', notice: 'AISIN GROUP (ATTG) employees with a Microsoft 365 account only',
    warnTitle: '⚠ Microsoft 365 is not connected yet',
    step1: 'Ask IT to register the app in Microsoft Entra ID, or add this address to the registration shared with DSR / A-SOP, with Redirect URI (Single-page application) = ',
    step2: 'Put M365_TENANT_ID and M365_CLIENT_ID in the .env file', step3: 'Close the API window and run start.bat again',
    contact: 'Contact Mr.Santi (santi.s@attg.co.th)', demoTitle: 'Sample users (training machine)', close: 'Close',
    signingIn: 'Signing in…', dark: 'Dark mode', light: 'Light mode',
  },
};
const CARD_COLORS = ['#1d4ed8', '#0ea5e9', '#16a34a', '#f97316', '#8b5cf6', '#dc2626'];
const CARD_ICONS = [ // calendar, clock, team, sliders, chart, shield
  '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  '<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2M16 3.1a4 4 0 0 1 0 7.8M22 21v-2a4 4 0 0 0-3-3.9"/>',
  '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  '<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>',
  '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
];
const ROLE_LABEL = { superadmin: 'Super Admin', admin: 'Admin', manager: 'Manager', user: 'User' };
const REDIRECT_URI = location.origin + '/';
const $ = (id) => document.getElementById(id);
let lang = localStorage.getItem('hrs.lang') || 'th';
let cfg = { m365: false, demo: false };
let demoUsers = [];

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('cards').replaceChildren(...t.cards.map((text, i) => {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<i style="background:${CARD_COLORS[i]}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${CARD_ICONS[i]}</svg></i><span></span>`;
    card.querySelector('span').textContent = text;
    return card;
  }));
  $('step1').replaceChildren(t.step1, Object.assign(document.createElement('code'), { textContent: REDIRECT_URI }));
  const dark = document.body.classList.contains('dark');
  $('darkBtn').title = dark ? t.light : t.dark;
  $('darkBtn').innerHTML = dark
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  renderUsers();
}

function renderUsers() {
  $('users').replaceChildren(...demoUsers.map((u) => {
    const name = lang === 'en' && u.Fname_EN ? `${u.Fname_EN} ${u.Lname_EN || ''}` : `${u.Fname_TH} ${u.Lname_TH || ''}`;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'user';
    b.innerHTML = '<span class="avatar"></span><span class="who"><div></div><small></small></span><span class="badge"></span>';
    b.querySelector('.avatar').textContent = name.trim().charAt(0);
    b.querySelector('.who div').textContent = name;
    b.querySelector('small').textContent = u.Email;
    const badge = b.querySelector('.badge'); badge.textContent = ROLE_LABEL[u.Role]; badge.classList.add(u.Role);
    b.onclick = () => finish(api('/api/auth/demo', { userId: u.UserID }));
    return b;
  }));
}

async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function finish(loginPromise) {
  $('error').textContent = '';
  try {
    const { token } = await loginPromise;
    sessionStorage.setItem('hrs.token', token);
    location.replace('/dashboard');
  } catch (err) {
    $('dlg').close();
    $('error').textContent = err.message;
    $('msBtn').disabled = false;
  }
}

// ---- Microsoft 365: authorization code + PKCE, redirect (the same flow MSAL.js uses for SPAs) ----
const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const randomString = () => b64url(crypto.getRandomValues(new Uint8Array(32)));
const authority = () => `https://login.microsoftonline.com/${cfg.tenantId}/oauth2/v2.0`;

async function startM365() {
  // ponytail: crypto.subtle needs a secure context (https or localhost); serve over https before opening to the LAN
  const verifier = randomString(), state = randomString(), nonce = randomString();
  sessionStorage.setItem('hrs.pkce', JSON.stringify({ verifier, state, nonce }));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  location.assign(`${authority()}/authorize?` + new URLSearchParams({
    client_id: cfg.clientId, response_type: 'code', redirect_uri: REDIRECT_URI, response_mode: 'fragment',
    scope: 'openid profile email', state, nonce, code_challenge: challenge, code_challenge_method: 'S256', prompt: 'select_account',
  }));
}

async function completeM365(params) {
  const saved = JSON.parse(sessionStorage.getItem('hrs.pkce') || '{}');
  sessionStorage.removeItem('hrs.pkce');
  if (!saved.state || params.get('state') !== saved.state) throw new Error('state ไม่ตรงกัน กรุณาลองใหม่');
  const res = await fetch(`${authority()}/token`, {
    method: 'POST',
    body: new URLSearchParams({ client_id: cfg.clientId, grant_type: 'authorization_code', code: params.get('code'),
      redirect_uri: REDIRECT_URI, code_verifier: saved.verifier, scope: 'openid profile email' }),
  });
  const tok = await res.json();
  if (!tok.id_token) throw new Error(tok.error_description || 'Microsoft ไม่ส่ง ID token กลับมา');
  return api('/api/auth/m365', { idToken: tok.id_token, nonce: saved.nonce });
}

async function openDialog() {
  $('warn').hidden = cfg.m365;
  $('demoBox').hidden = !cfg.demo;
  if (cfg.demo && !demoUsers.length) { demoUsers = await api('/api/auth/demo-users'); renderUsers(); }
  $('dlg').showModal();
}

// ---- wire up ----
document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => { lang = b.dataset.lang; localStorage.setItem('hrs.lang', lang); render(); });
$('darkBtn').onclick = () => { document.body.classList.toggle('dark'); localStorage.setItem('hrs.dark', document.body.classList.contains('dark') ? '1' : ''); render(); };
if (localStorage.getItem('hrs.dark')) document.body.classList.add('dark');
render();

$('msBtn').onclick = async () => {
  if (!cfg.m365) return openDialog().catch((e) => { $('error').textContent = e.message; });
  $('msBtn').disabled = true;
  startM365().catch((e) => { $('error').textContent = e.message; $('msBtn').disabled = false; });
};
$('demoLink').onclick = () => openDialog().catch((e) => { $('error').textContent = e.message; });

(async () => {
  cfg = await api('/api/auth/config');
  $('demoLink').hidden = !(cfg.m365 && cfg.demo);
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.has('code') || hash.has('error')) {
    history.replaceState(null, '', '/');
    if (hash.has('error')) throw new Error(hash.get('error_description') || hash.get('error'));
    $('msBtn').disabled = true;
    $('error').textContent = T[lang].signingIn;
    return finish(completeM365(hash));
  }
  if (sessionStorage.getItem('hrs.token')) location.replace('/dashboard');
})().catch((e) => { $('error').textContent = e.message; });
</script>
